<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        span{
            font-size:28px;
            margin-right:40px;
            color: brown;
        }
        .top{
            width: 1400px;
            height: 60px;
            background-color: white;
            margin: 0 auto;
        }
         #nav{
            width: 1300px;
            background-color: white;
            margin: 0 auto;
            text-align:center;
        }
        .nav_top{
            font-size: 14px;
            color: #000;
            padding-left: 20px;
            padding-top: 23px; 
            display: inline-block; 
        }
        #nav img{
            width:  270px;
            height: 129px;
        }
        .nav_top a{
            text-decoration: none;
            font-family: arial;
        }
        .nav_top a:link{
            color: #222 ;
        }
        .nav_top a:hover{
            color:skyblue;
            text-decoration: dotted;
        }
        .form{
            width: 680px;
            height: 80px;
            margin: 30px auto 0;
            border: 1px solid blue;
            border-radius: 8px;
            display: flex;
            flex-direction: column; /*纵向排列（上下）*/
            justify-content: space-between; /*上下拉开距离*/
            
        }
        .form input{
            flex:1;
            font-size:16px;
            padding:0 12px;
            border:1px solid #ccc;
            border-radius:8px 0 0 8px;
            outline: none;
        }
        .form button{
            width:110px;
            background:#2982ff;
            color:white;
            border:none;
            border-radius:0 8px 8px 0;
            font-size:16px;
            cursor:pointer;
            align-self: flex-end;
        }
        .main{
            width: 1200px;
            height: 900px;
            border:  2px solid brown;
            margin: 0 auto;

        }
        .amain{
            width:500px;
            height: 50px;
            margin: 0 auto;
            text-align:center;
        }
        .hot-box{
            width: 1000px;
            margin: 20px auto;
            border:1px solid #eee;
            padding:10px;
        }
        .hot-title{
            display:flex;
            justify-content: space-between;
            font-size:22px;
            margin-bottom:15px;
        }
    .change{
            font-size:16px;
            color:#666;
        }
        .hot-container{
            display:flex;
            justify-content: space-between;
        }
        .hot-left,.hot-right{
            width:48%;
        }
        .hot-item{
            height:40px;
            line-height:40px;/*单行文字垂直居中*/
            font-size:18px;
        }
        .num{
            margin-right:8px;
}
    </style>
</head>
<body>

        <span>锡大热搜 ></span>

    <!-- 里面再套一个盒子，放左右两栏 -->
<div class="hot-container">

</div>

</body>
</html>
